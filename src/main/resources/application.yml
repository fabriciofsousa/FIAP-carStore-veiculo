spring:
  application:
    name: veiculo

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      client:
        registration:
          cognito:
            client-id: uiirrd4fog77qj2o91ers5edk
            scope: openid
            redirect-uri: "{baseUrl}/login/oauth2/code/cognito"
            client-name: Cognito
            authorization-grant-type: authorization_code
        provider:
          cognito:
            issuer-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_LFntHymVY
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_LFntHymVY

app:
  security:
    cognito:
      groups-claim: cognito:groups

logging:
  level:
    org.springframework.security: DEBUG